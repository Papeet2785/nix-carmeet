general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}
background {
    color = rgb(1d2021)
    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}
input-field {
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(b8bb26)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(fbf1c7)
    fade_on_empty = false
    font_family = MesloLGS Nerd Font Mono
    placeholder_text = <span foreground="##fbf1c7">PIN</span>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}
