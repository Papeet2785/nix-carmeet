[nightlight]
enabled = true
force = true
temperature_day = 6000
temperature_night = 6000

[notification]
position = "bottom_right"

[osd]
position = "bottom_right"
position_vertical = "bottom_right"

    [osd.kinds]
    keyboard_backlight = false
    wifi = false

[plugin_settings."nightwatch75/file-search"]
panel_placement = "floating"
panel_position = "center"

[plugins]
auto_update = true
enabled = []

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
app_icon_color = "tertiary"
corner_radius_scale = 0.0
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"
popup_shadows = false

    [shell.animation]
    speed = 1.3500000201165676

    [shell.launcher]
    app_grid = true
    fetch_exchange_rates = false

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center_left"
    floating_layer = "top"
    launcher_position = "top_left"
    session_placement = "floating"
    session_position = "bottom_left"
    shadow = false
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    size = 1

    [shell.screenshot]
    copy_to_clipboard = false
    directory = "/home/carmeet/Pictures/Screenshots"
    freeze_screen = false
    save_to_file = false

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [shell.shadow]
    alpha = 0.0

[theme]
builtin = "Gruvbox"
community_palette = "Gruvbox Material Hard"
custom_palette = "stylix"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper"
fill_mode = "stretch"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper/car.jpeg"

    [wallpaper.last]
    path = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper/car.jpeg"

    [wallpaper.monitors.eDP-1]
    path = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper/car.jpeg"

