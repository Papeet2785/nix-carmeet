    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 500.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 400.0

[location]
