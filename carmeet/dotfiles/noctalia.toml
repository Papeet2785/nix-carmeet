config_version = 17

[audio]
enable_notification_sounds = false
enable_power_sounds = false
enable_screenshot_sounds = false
enable_sounds = false
enable_volume_sounds = false

[bar.default]
center = [ "control-center", "clock", "tray" ]
end = [ "ram", "cpu", "temp", "volume", "battery" ]
margin_ends = 0
padding = 7
radius_top_left = 0
radius_top_right = 0
start = [ "workspaces", "bar", "active_window" ]
widget_spacing = 20

[location]
address = "Charlotte, NC"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@WL-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 947.0
    cy = 838.00006103515625
    output = "WL-1"
    placement_height = 1020.0
    placement_width = 1894.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 959.99993896484375
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true
temperature_day = 5400
temperature_night = 5400

[notification]
position = "bottom_right"

[plugins]
enabled = [ "raycursive/niri-displays" ]

[shell.launcher]
app_grid = true
category_icons_only = true
compact = true
layout = "simple"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "destructive"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = false
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = false
shortcut = "3"
variant = "default"

[wallpaper]
directory = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper/solar_system.jpeg"

    [wallpaper.last]
    path = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper/solar_system.jpeg"

    [wallpaper.monitors.eDP-1]
    path = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper/solar_system.jpeg"

[widget.bar]
type = "raycursive/niri-displays:bar"

[widget.battery]
color = "#458588"
display_mode = "graphic"

[widget.clock]
color = "tertiary"
format = "{:%A %e, %I:%M:%S %p}"

[widget.control-center]
color = "primary"
glyph = "device-ipad"

[widget.cpu]
color = "secondary"
icon_color = "secondary"

[widget.ram]
color = "primary"
icon_color = "primary"

[widget.temp]
color = "on_tertiary_container"
icon_color = "on_tertiary_container"

[widget.tray]
drawer = true
scale = 0.60000000000000009

[widget.volume]
color = "on_error_container"

[widget.workspaces]
empty_color = "primary_container"
focused_color = "#458588"
occupied_color = "primary"