[nightlight]
enabled = true
force = true
temperature_day = 6000
temperature_night = 6000

[notification]
position = "top_center"

[osd.kinds]
keyboard_backlight = false

[plugins]
auto_update = false
enabled = []

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
app_icon_color = "tertiary"
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"

    [shell.animation]
    speed = 1.3500000201165676

    [shell.launcher]
    app_grid = true
    fetch_exchange_rates = false

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    clipboard_placement = "attached"
    floating_layer = "top"
    launcher_placement = "attached"
    polkit_placement = "attached"

    [shell.screen_corners]
    size = 12

    [shell.screenshot]
    directory = "/home/carmeet/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [shell.shadow]
    alpha = 0.99999997764825821

[theme]
builtin = "Ayu"
community_palette = "One Dark Two"
custom_palette = "stylix"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper"
fill_mode = "stretch"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper/nixos.png"

    [wallpaper.last]
    path = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper/nixos.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/carmeet/nix-carmeet/carmeet/dotfiles/wallpaper/nixos.png"

