config_version = 12

[backdrop]
blur_intensity = 0.0
enabled = true

[bar.default]
capsule_radius = 0
center = [ "control-center", "spacer_4", "clock", "spacer_5", "temp" ]
end = [ "volume", "spacer_6", "battery", "spacer_7", "session" ]
margin_ends = 0
padding = 5
panel_overlap = 0
position = "left"
radius = 0
radius_top_left = 0
radius_top_right = 0
shadow = false
start = [ "launcher", "spacer_2", "workspaces", "spacer_3", "tray" ]
thickness = 36

[battery]
warning_threshold = 30

[control_center]
hidden_tabs = [ "media", "audio", "monitor", "network", "bluetooth", "screen-time" ]

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "clipboard"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
icon_size = 30
radius = 0
shadow = false
show_dots = true
smart_auto_hide = true

[idle]
