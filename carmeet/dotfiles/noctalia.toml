config_version = 12

[backdrop]
blur_intensity = 0.0
enabled = true

[bar.default]
center = [ "control-center", "spacer_4", "clock", "date", "spacer_2", "tray" ]
end = [ "volume", "spacer_6", "group:g2", "spacer_5", "battery", "spacer_3", "session" ]
margin_ends = 0
padding = 10
panel_overlap = 0
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "spacer_7", "group:g1", "spacer_8", "active_window" ]
thickness = 30

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "workspaces" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 7.0
    radius = 10.0
    widget_spacing = 23

[battery]
warning_threshold = 30

[control_center]
hidden_tabs = [ "media", "audio", "monitor", "screen-time" ]

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
icon_size = 30
shadow = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 500.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 400.0

